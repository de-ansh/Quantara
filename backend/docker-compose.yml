services:
  postgres:
    image: pgvector/pgvector:pg15  # pgvector required by document_chunks.embedding
    container_name: quantara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantara
      POSTGRES_PASSWORD: quantara
      POSTGRES_DB: quantara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quantara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: pgvector/pgvector:pg15  # same major version as the server, so pg_dump matches
    container_name: quantara-db-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: quantara
      PGPASSWORD: quantara
      PGDATABASE: quantara
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Daily custom-format dump; written as .partial first so a failed dump never looks complete
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/quantara-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.partial"; then mv "$$f.partial" "$$f"; echo "backup written: $$f"; else rm -f "$$f.partial"; echo "backup FAILED" >&2; fi
          find /backups -name 'quantara-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

  backend:
    build: .
    container_name: quantara-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://quantara:quantara@postgres:5432/quantara
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runs the built image (Dockerfile CMD: migrate, then serve). No --reload: a reload that hangs
    # leaves the old process holding the background-job locks, which once stopped prices for two days.
    # After code changes: docker compose up -d --build backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: quantara-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
