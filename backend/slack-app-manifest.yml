# Paste at https://api.slack.com/apps -> Create New App -> From a manifest. Socket Mode: no public URL needed.
# Then: Basic Information -> App-Level Tokens -> generate one with connections:write (SLACK_APP_TOKEN, xapp-),
# Install App -> copy the Bot User OAuth Token (SLACK_BOT_TOKEN, xoxb-). Add both and SLACK_USERS to .env.
display_information:
  name: Quantara
  description: Quantara's research assistant
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Quantara
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read  # @Quantara in a channel
      - chat:write         # answer, then edit the "Looking that up…" placeholder
      - im:history         # direct messages and their threads
      - channels:history   # earlier messages in a channel thread, for follow-ups
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
