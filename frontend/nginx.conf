server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes (/risk, /signals, ...) all load the SPA
    location / {
        try_files $uri /index.html;
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
